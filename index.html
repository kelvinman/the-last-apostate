<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
    <!-- Link previews. Crawlers want an absolute og:image URL, so these point at the
         GitHub Pages copy; change them if the game moves. -->
    <meta property="og:title" content="The Last Apostate" />
    <meta property="og:description" content="A browser game about how much of your thinking you've handed over." />
    <meta property="og:url" content="https://kelvinman.github.io/the-last-apostate/" />
    <meta property="og:image" content="https://kelvinman.github.io/the-last-apostate/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Saved to a home screen: the rose window icon, and the game opens full screen without
         the browser's bars. The icons are drawn by scripts/generate-cathedral-sprites.mjs. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="The Last Apostate" />
    <meta name="theme-color" content="#050307" />
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
